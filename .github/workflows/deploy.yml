name: Build and Push ZenTime Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # --ignore-scripts : ces jobs n'exécutent jamais réellement bcrypt
        # (tout est mocké dans les tests), pas besoin de laisser tourner de
        # scripts d'installation tiers.
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        # --no-install : interdit à npx d'aller chercher un paquet sur le
        # registre s'il n'est pas déjà installé localement (il l'est, via
        # npm ci juste au-dessus).
        run: npx --no-install prisma generate

      - name: Run tests
        run: npm test

  sonarcloud:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # nécessaire pour que Sonar dépose son résumé sur la PR
      checks: write
    # Analyse de qualité/sécurité du code (SAST). Informatif pour l'instant :
    # ne bloque pas le build tant que les premiers résultats n'ont pas été
    # passés en revue (voir Security.md).

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet requis par l'analyse SonarCloud

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # --ignore-scripts : ces jobs n'exécutent jamais réellement bcrypt
        # (tout est mocké dans les tests), pas besoin de laisser tourner de
        # scripts d'installation tiers.
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        # --no-install : interdit à npx d'aller chercher un paquet sur le
        # registre s'il n'est pas déjà installé localement (il l'est, via
        # npm ci juste au-dessus).
        run: npx --no-install prisma generate

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            zineddinebe/zentime-app:latest
            zineddinebe/zentime-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
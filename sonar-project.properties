sonar.projectKey=ZineddineBE_ZenTime
sonar.organization=zineddinebe

# Racine du code source à analyser. Explicite plutôt que laissé à la
# détection automatique du scanner, qui n'indexait qu'une quinzaine de
# fichiers au lieu de l'ensemble du projet (et empêchait au passage la
# remontée de la couverture de tests dans SonarCloud).
sonar.sources=.

# Périmètre analysé : tout le code source, hors dépendances, build et code
# généré/vendored (jamais écrit ni maintenu à la main dans ce projet).
sonar.exclusions=node_modules/**,.next/**,coverage/**,public/scalar/standalone.js,prisma/client/**,prisma/migrations/**

# Fichiers de test, pour que Sonar ne les compte pas comme code applicatif.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.tests=.
sonar.test.exclusions=node_modules/**,.next/**

# Rapport de couverture Vitest (généré par `npm run test:coverage`), pour que
# le pourcentage de couverture remonte aussi dans SonarCloud.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
